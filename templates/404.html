{% extends "base.html" %}
{% block title %}404 - Page Not Found{% endblock %}

{% block public_content %}
<div style="min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem;">
    <div>
        <h1 style="font-size: 5rem; color: var(--primary); font-weight: 800; margin: 0;">404</h1>
        <h2 style="color: var(--navy-dark); margin: 0.5rem 0 1.5rem;">Page Not Found</h2>
        <p style="color: var(--text-muted); max-width: 450px; margin: 0 auto 2rem;">
            The requested page does not exist or has been moved.
        </p>
        <a href="{{ url_for('public.index') }}" class="btn btn-primary btn-lg">Return to Homepage</a>
    </div>
</div>
{% endblock %}
