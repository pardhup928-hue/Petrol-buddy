{% extends "base.html" %}
{% block title %}Sign In – Petrol Buddy{% endblock %}

{% block public_content %}
<section style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:3rem 1rem;">
  <div class="card" style="max-width:440px;width:100%;border-top:4px solid #f97316;">
    <!-- Header -->
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="width:64px;height:64px;border-radius:50%;background:rgba(249,115,22,0.15);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 1rem;">🔒</div>
      <h2 style="color:#ffffff;font-size:1.5rem;margin-bottom:0.25rem;">Welcome Back</h2>
      <p style="color:#94a3b8;font-size:0.9rem;">Sign in to your Petrol Buddy account</p>
    </div>

    <!-- Login Form -->
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label class="form-label" for="role">Login As</label>
        <select id="role" name="role" class="form-control" required>
          <option value="customer" {% if selected_role == 'customer' %}selected{% endif %}>Customer</option>
          <option value="admin" {% if selected_role == 'admin' %}selected{% endif %}>Admin</option>
          <option value="delivery" {% if selected_role == 'delivery' %}selected{% endif %}>Delivery Partner</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:0.5rem;">Sign In</button>
    </form>

    <!-- Demo Credentials -->
    <div style="margin-top:1.5rem;border-top:1px solid #334155;padding-top:1.25rem;">
      <p style="color:#94a3b8;font-size:0.8rem;text-align:center;margin-bottom:0.75rem;">Quick Demo Login</p>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:center;">
        <button type="button" class="btn btn-outline btn-sm" onclick="fillDemoCredentials('customer')">👤 Customer</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="fillDemoCredentials('admin')">🛠️ Admin</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="fillDemoCredentials('delivery')">🚚 Delivery</button>
      </div>
    </div>

    <!-- Register Link -->
    <p style="text-align:center;color:#94a3b8;font-size:0.9rem;margin-top:1.5rem;">
      Don't have an account? <a href="{{ url_for('auth.register') }}" style="color:#f97316;text-decoration:none;font-weight:600;">Register here</a>
    </p>
  </div>
</section>

<script>
function fillDemoCredentials(role) {
  const creds = {
    customer: { email: 'customer@demo.com', password: 'demo123' },
    admin:    { email: 'admin@demo.com',    password: 'demo123' },
    delivery: { email: 'delivery@demo.com', password: 'demo123' }
  };
  const c = creds[role];
  if (!c) return;
  document.getElementById('role').value = role;
  document.getElementById('email').value = c.email;
  document.getElementById('password').value = c.password;
}
</script>
{% endblock %}
